[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cupboard-pi"
version = "0.1.0"
description = "Cupboard Tracker Pi client: reads the scanners and sends scan events and heartbeats to ingest."
requires-python = ">=3.11"
# Standard library only at runtime: the Pi is a lean thin client.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2"]  # build: deploy/pi.sh builds the wheel

[project.scripts]
cupboard-pi = "cupboard_pi.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert, and fake secrets in tests
