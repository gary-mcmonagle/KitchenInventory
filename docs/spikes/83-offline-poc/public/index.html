<!doctype html>
<html lang="en-GB">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#F4F7F3" />
        <link rel="manifest" href="/manifest.webmanifest" />
        <link rel="apple-touch-icon" href="/icon-192.png" />
        <link rel="stylesheet" href="/app.css" />
        <title>Offline PoC</title>
    </head>
    <body>
        <h1>Shopping (offline PoC)</h1>
        <p>Spike #83: a throwaway list to test offline use. Nothing here touches Cupboard Tracker.</p>
        <div id="banner" role="status" aria-live="polite"></div>
        <form id="add">
            <input name="name" placeholder="Add an item" autocomplete="off" aria-label="Item" />
            <button type="submit">Add</button>
        </form>
        <ul id="list"></ul>
        <p class="meta" id="storage"></p>
        <p class="meta" id="installed"></p>
        <script src="/app.js"></script>
    </body>
</html>
