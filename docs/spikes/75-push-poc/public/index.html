<!doctype html>
<html lang="en-GB">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#F4F7F3" />
        <link rel="manifest" href="/manifest.webmanifest" />
        <link rel="apple-touch-icon" href="/icon-192.png" />
        <title>Push PoC</title>
        <style>
            body {
                margin: 0;
                padding: 28px 20px;
                font-family: system-ui, sans-serif;
                background: #f4f7f3;
                color: #1c2a24;
            }
            h1 {
                margin: 0 0 4px;
                font-size: 28px;
            }
            p {
                color: #5b6b63;
                line-height: 1.4;
            }
            button {
                width: 100%;
                min-height: 52px;
                border: 0;
                border-radius: 14px;
                background: #2f6b4f;
                color: #fff;
                font: inherit;
                font-size: 16px;
                font-weight: 700;
            }
            button:disabled {
                opacity: 0.6;
            }
            pre {
                white-space: pre-wrap;
                word-break: break-all;
                font-size: 12px;
                background: #fff;
                border: 1px solid #e1e8e3;
                border-radius: 14px;
                padding: 12px;
            }
        </style>
    </head>
    <body>
        <h1>Push PoC</h1>
        <p>Spike #75: a throwaway page to test push notifications. Nothing here touches Cupboard Tracker.</p>
        <button id="turn-on" type="button">Turn on notifications</button>
        <pre id="log" aria-live="polite"></pre>
        <script>
            const log = (line) => (document.getElementById("log").textContent += line + "\n");
            const standalone =
                matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
            log(`Service worker: ${"serviceWorker" in navigator}, PushManager: ${"PushManager" in window}`);
            log(`Notification permission: ${"Notification" in window ? Notification.permission : "n/a"}`);
            log(`Running as an installed app: ${standalone}`);
            if (!("PushManager" in window) && /iPhone|iPad/.test(navigator.userAgent) && !standalone) {
                log("On iPhone: Share → Add to Home Screen, then open it from the Home Screen icon.");
            }

            const toKey = (base64url) => {
                const raw = atob(base64url.replace(/-/g, "+").replace(/_/g, "/"));
                return Uint8Array.from(raw, (c) => c.charCodeAt(0));
            };

            async function turnOn() {
                const registration = await navigator.serviceWorker.register("/sw.js", { scope: "/" });
                await navigator.serviceWorker.ready;
                // Must be called from the tap itself: iOS refuses a prompt that isn't from a user gesture.
                const permission = await Notification.requestPermission();
                log(`Permission: ${permission}`);
                if (permission !== "granted") return;
                const { vapidPublicKey } = await (await fetch("/config")).json();
                const subscription =
                    (await registration.pushManager.getSubscription()) ??
                    (await registration.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: toKey(vapidPublicKey),
                    }));
                const response = await fetch("/subscribe", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(subscription),
                });
                log(`Subscribed with ${new URL(subscription.endpoint).host}; saved: HTTP ${response.status}`);
            }

            document.getElementById("turn-on").addEventListener("click", (e) => {
                e.target.disabled = true;
                turnOn()
                    .catch((error) => log(`Failed: ${error.name}: ${error.message}`))
                    .finally(() => (e.target.disabled = false));
            });
            if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js", { scope: "/" });
        </script>
    </body>
</html>
